kind = "web"
previewPath = "/"
title = "Gestão Santa Print"
description = "Painel de gestão da operação técnica da Santa Print, com visão geral, filtros por período e indicadores operacionais."
version = "1.0.0"
id = "artifacts/santa-print"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19953

[services.development]
run = "pnpm --filter @workspace/santa-print run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/santa-print", "run", "build" ]
serve = "static"
publicDir = "artifacts/santa-print/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19953"
BASE_PATH = "/"
